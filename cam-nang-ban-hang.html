:root{color-scheme:light dark;--bg:light-dark(#f4f8f3,#0e1a14);--card:light-dark(#fff,#15261d);--ink:light-dark(#13261b,#e6f1ea);--mut:light-dark(#5b6b61,#9db3a5);--g:#1b5e3b;--g2:light-dark(#1b5e3b,#5fc08a);--t:light-dark(#0f8b8d,#4cc6c8);--y:#e0a800;--line:light-dark(#dbe6dd,#29402f);--soft:light-dark(#e8f3ec,#1b3325);--fb:light-dark(#fff7dc,#2b2610)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Be Vietnam Pro',system-ui,sans-serif;overflow-x:clip}
header{background:var(--g);color:#fff;padding:16px max(4vw,16px) 0}

h1{font-size:clamp(22px,5vw,34px)}h2{font-size:21px;color:var(--g2);margin-top:8px}h3{font-size:16px;margin-top:14px}

nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;color:#fff;text-decoration:none;padding:10px 13px;border-radius:10px 10px 0 0;font-weight:600;font-size:14px;opacity:.8}
nav a.on{background:var(--bg);color:var(--g2);opacity:1}
main{max-width:860px;margin:auto;padding:16px max(4vw,14px) 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}

textarea{min-height:70px}

.calc .out{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}

@media(max-width:600px){.stages{grid-template-columns:repeat(4,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mut);font-size:12px}.stack td:empty{display:none}.stack tr:first-child{display:none}}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head><body>

vung:{n:'HTX, vùng trồng (20 phút)',ai:'HTX, THT, vùng đã có hoặc chưa có mã; cà phê; cây khác',
prep:['Tài khoản demo trên app.farmbase.vn (mã tổ chức, email, mật khẩu) với vùng mẫu đã làm mờ tên, số điện thoại','Điện thoại có Zalo, đã mở sẵn FarmBase Mini App và thêm vào màn hình chính','In sẵn 1 mã QR vùng mẫu để khách quét','4G dự phòng, sạc đầy; nếu chiếu thì mang cáp','Biết trước: cây, ha, số hộ, đã có mã chưa, vướng gì (từ cuộc gọi)','Nếu được: xin trước tọa độ 1 vườn của khách để tạo thử'],
steps:[
['0–2','Mở đầu','Nhắc lại vướng mắc khách đã nói, nói trước 3 việc sẽ xem.','Hôm trước anh nói vướng nhất là [vướng mắc]. Hôm nay em cho anh xem 3 việc: tạo vùng, nông dân ghi nhật ký trên Zalo, và người mua quét QR thấy gì.','Khách thấy buổi demo nói đúng chuyện của mình'],
['2–5','Tổng quan vùng, bản đồ','Đăng nhập trang quản lý. Mở tổng quan: số điểm sản xuất, nông hộ, diện tích, số cây. Mở bản đồ lô, lọc theo cây trồng, xã.','Đây là cả vùng trên một màn hình. Bấm vào lô nào là thấy chủ hộ, diện tích, giống, số cây.','Cả vùng gọn trên một màn hình'],
['5–8','Tạo một lô ngay tại chỗ','Thêm lô: tìm nông dân theo số điện thoại (chưa có thì thêm mới), nhập tọa độ hoặc định vị, bấm tìm lô đất. Nhập diện tích, giống, số cây, năm trồng, thuần hay xen.','Anh thấy không, nhập tọa độ là hệ thống tự điền số tờ, số thửa. Ảnh sổ đỏ chỉ để làm hồ sơ, không hiện ra ngoài.','Tự điền số tờ, số thửa'],
['8–12','Nông dân ghi nhật ký trên Zalo','Đưa điện thoại cho khách tự bấm: Zalo, FarmBase, chọn vườn, Thêm ghi chép, chọn thuốc trong danh mục (thấy hoạt chất, liều, thời gian cách ly), chụp ảnh bao bì, lưu. Cho xem ủy quyền người thân và cập nhật thu hoạch.','Bà con không phải cài thêm gì, Zalo đang dùng hằng ngày. Chụp ảnh bao bì là xong, con cháu ghi giúp cũng được.','Khách tự ghi được một nhật ký'],
['12–14','Nhật ký về trang quản lý','Quay lại web: nhật ký vừa ghi đã hiện. Cho xem nhập Excel hàng loạt (hệ thống báo dòng lỗi) và cột trạng thái cần đồng bộ, đã đồng bộ.','Vùng đã có mã thì nhật ký được đồng bộ lên hệ thống truy xuất của Bộ, HTX theo dõi được còn bao nhiêu bản ghi chưa đồng bộ.','Thấy kết nối với hệ thống của Bộ'],
['14–17','QR và trang truy xuất','Tải QR vùng và QR một lô. Mời khách quét bằng điện thoại của họ: vùng, mùa vụ, nhật ký, ảnh, tài liệu trong thư viện.','Người mua quét là thấy vườn, nhật ký, ảnh. CCCD chỉ hiện 4 số cuối, sổ đỏ không công khai.','Khách tự quét trên máy mình'],
['17–18','Nối vào hồ sơ mã','Nói ngắn: dữ liệu này là nguồn cho 5 nhật ký bắt buộc, Phiếu khảo sát phía Trung Quốc và hậu kiểm.','Sai ở đâu thì sửa trên hệ thống rồi xuất lại, không phải sửa tay trên giấy.','Hiểu phần mềm phục vụ việc giữ mã'],
['18–20','Chốt bước tiếp','Hỏi phần nào hợp nhất, đề xuất tạo thử, hẹn ngày.','Anh thấy phần nào hợp với HTX nhất? Em đề xuất tạo thử 3 đến 5 hộ của mình trong tuần này. Anh gửi em danh sách hộ trước thứ mấy được?','Có ngày hẹn cụ thể']]},
dn:{n:'Doanh nghiệp đóng gói, lô hàng (25 phút)',ai:'DN thu mua, đóng gói, xuất khẩu. Bắt buộc có kỹ thuật đi kèm',
prep:['Kỹ thuật FarmBase đi cùng, tài khoản có phân hệ lô hàng (Warehub) và một lô mẫu','Hỏi trước: số cơ sở đóng gói, mã cơ sở, sản phẩm và quy cách thùng, đã là thành viên GS1 chưa, có GTIN chưa','Mở sẵn file “Câu hỏi làm rõ thiết lập demo 19/11” để ghi câu trả lời','Một vùng mẫu đã có mã để làm nguồn hàng','Nhớ nói: phân hệ cơ sở đóng gói dự kiến chính thức từ 11/2026, GS1 theo lộ trình'],
steps:[
['0–2','Mở đầu','Hỏi số mã vùng trồng đang thu mua, cách đang ghi nguồn hàng.','Hôm nay em cho anh xem một lô hàng đi từ vườn đến container và tem: nguồn hàng theo mã vùng, container, GS1 và tem QR.','Đúng nỗi lo lẫn hàng, chứng từ'],
['2–5','Vùng cấp hàng','Mở bản đồ các vùng đã có mã cấp hàng, bấm vào một vùng xem nông hộ, nhật ký.','Trước khi có lô hàng, mình phải biết hàng đến từ vùng nào, vùng đó ghi chép ra sao.','Thấy nguồn hàng có dữ liệu thật'],
['5–9','Tạo lô hàng','Tạo lô: mã lô tự sinh; chọn cơ sở đóng gói, ngày thu hoạch, đóng gói, sản xuất, hết hạn; nhà xuất khẩu, nhập khẩu, cửa khẩu. Thêm hàng hóa: số thùng, tấn, số trái; container, số seal, ngày đóng.','Mỗi container một hồ sơ, số seal ghi ngay trong lô.','Một màn hình cho cả lô'],
['9–13','Nguồn gốc theo mã vùng','Thêm nguồn hàng bằng CCCD nông dân: hệ thống tra tên, mã vùng trồng, sinh đơn mua hàng, kèm nhật ký canh tác.','Hộ không có hồ sơ, không gắn mã vùng thì không thêm vào lô được. Đó là cách chặn hàng ngoài mã.','Không lẫn hàng ngoài mã'],
['13–17','GS1 và Cổng truy xuất','Kỹ thuật thao tác: tạo lệnh sản xuất (GTIN, vùng GS1), nạp sự kiện tự động: trồng, thu hoạch, lưu kho, bán, vận chuyển, đóng gói; gửi lên. Tra trên Cổng truy xuất quốc gia bằng GTIN và số lô.','Dữ liệu từ vườn tự thành chuỗi sự kiện, không phải nhập lại.','Thấy kết quả trên Cổng quốc gia'],
['17–20','In tem','In tem trái, tem thùng, tem container song ngữ Việt, Anh, Trung: mã vùng trồng, mã cơ sở đóng gói, ngày đóng gói, số lô, QR, mã vạch GS1-128.','Mỗi lần in sinh dải mã mới gắn đúng lô.','Tem cầm tay được'],
['20–22','Trang QR của lô','Quét tem: mã hợp lệ, container, seal, mã vùng trồng, nông hộ, nhật ký.','Nhà nhập khẩu, hải quan quét là thấy.','Khách tự quét'],
['22–25','Chốt và hỏi thiết lập','Hỏi theo file câu hỏi: tổ chức, chữ ký số, GS1, GTIN, địa điểm, quy tắc lô. Hẹn báo giá.','Để dựng đúng như hàng của mình, em xin anh mấy thông tin này, em gửi báo giá trong 3 ngày làm việc.','Có đủ đầu vào báo giá']]},

let DB=null,USER=null,UID=null,OWNER=false,ALL=[],PROF={},CANW=true;
const SUPA=(window.CN_SUPA&&window.CN_SUPA.url)?window.CN_SUPA:null,CN=window.CN_ID||'ban-hang';
const mask=t=>String(t||'').replace(/\d[\d .-]{7,}\d/g,'***');
const sh=(m,path,body,extra)=>fetch(SUPA.url+'/rest/v1/'+path,{method:m,headers:{apikey:SUPA.key,Authorization:'Bearer '+SUPA.key,'Content-Type':'application/json',Prefer:'return=minimal',...(extra||{})},body:body?JSON.stringify(body):undefined}).then(r=>{if(!r.ok)throw new Error(r.status);return m==='GET'?r.json():null});
async function supaLoad(){try{const rows=await sh('GET','camnang_gopy?cam_nang=eq.'+encodeURIComponent(CN)+'&select=*&order=at.desc&limit=1000');ALL=rows.map(r=>({k:r.k,label:r.label||'',goc:r.goc||'',sua:r.sua||'',lydo:r.lydo||'',at:Date.parse(r.at)||0,xong:!!r.xong,id:r.id,uid:'s',ten:r.ten||''}));paintFb()}catch(e){alert0('Chưa tải được góp ý chung, thử lại sau.')}}
const LBL={};
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const copyBtn=t=>`<button class="btn" data-c="${esc(t)}">Chép</button>`;
function fb(key,label,cur){LBL[key]=[label,cur||''];return `<div class="fbx"><button class="btn fbb" data-fb="${esc(key)}">Góp ý<span class="cnt" data-fbc="${esc(key)}" hidden></span></button><div data-fbf="${esc(key)}"></div><div class="fbl" data-fbl="${esc(key)}"></div></div>`}
function itemsFor(k){return ALL.filter(i=>i.k===k)}
function nameOf(i){return i.ten||PROF[i.uid]||'Ai đó'}
function itemHtml(i){return `<div class="it ${i.xong?'done':''}"><b>${esc(nameOf(i))}</b> · <span class="mut">${esc(new Date(i.at).toLocaleDateString('vi-VN'))}${i.xong?' · đã xử lý':''}</span><br>${i.sua?'Sửa thành: '+esc(i.sua):''}${i.lydo?'<br><span class="mut">Lý do: '+esc(i.lydo)+'</span>':''}${OWNER&&!i.xong&&i.uid?` <button class="btn g" data-done="${esc(i.uid)}|${esc(i.id)}">Đánh dấu đã xử lý</button>`:''}</div>`}
function paintFb(){document.querySelectorAll('[data-fbl]').forEach(el=>{const its=itemsFor(el.dataset.fbl);el.innerHTML=its.map(itemHtml).join('')});document.querySelectorAll('[data-fbc]').forEach(el=>{const n=itemsFor(el.dataset.fbc).filter(i=>!i.xong).length;el.hidden=!n;el.textContent=n});const g=document.getElementById('gopall');if(g)g.innerHTML=allFbHtml();const tab=nav.querySelector('a[href="#gop-y"]');if(tab){const n=ALL.filter(i=>!i.xong).length;tab.textContent='Góp ý'+(n?' ('+n+')':'')}}
function allFbHtml(){if(!ALL.length)return '<p class="mut">Chưa có góp ý nào. Bấm nút “Góp ý” ở bất kỳ mục nào để ghi.</p>';const open=ALL.filter(i=>!i.xong),done=ALL.filter(i=>i.xong);const grp=list=>{const m={};list.forEach(i=>{(m[i.k]=m[i.k]||[]).push(i)});return Object.entries(m).map(([k,its])=>`<div class="card"><b>${esc(its[0].label||k)}</b>${its[0].goc?`<div class="say" style="font-size:14px">${esc(its[0].goc.slice(0,300))}</div>`:''}<div class="fbl">${its.map(itemHtml).join('')}</div></div>`).join('')};const txt=open.map(i=>`[${i.label}] ${nameOf(i)}: ${i.sua}${i.lydo?' (lý do: '+i.lydo+')':''}`).join('\n');return `<div class="row">${copyBtn('Góp ý cẩm nang bán hàng:\n'+txt)}<span class="mut">${open.length} chưa xử lý · ${done.length} đã xử lý</span></div><h3>Chưa xử lý</h3>${grp(open)||'<p class="mut">Không còn.</p>'}${done.length?`<details><summary>Đã xử lý (${done.length})</summary>${grp(done)}</details>`:''}`}
function localItems(){const l=st.get('local',{});return Object.entries(l).map(([id,v])=>({...v,id,uid:'',ten:me.toi}))}
async function saveItem(it){
 if(SUPA){await sh('POST','camnang_gopy',{cam_nang:CN,k:it.k,label:it.label,goc:it.goc,sua:mask(it.sua),lydo:mask(it.lydo),ten:me.toi});await supaLoad();return true}
 if(DB&&UID&&CANW){const ref=DB.doc('gopy/'+UID);const snap=await ref.get();const d=snap.exists?structuredClone(snap.data()):{items:{}};d.ten=me.toi;d.items=d.items||{};d.items[it.id]=it;await ref.set(d);return true}
 const l=st.get('local',{});l[it.id]=it;st.set('local',l);ALL=localItems();paintFb();return false}
async function markDone(uid,id){if(SUPA){try{await sh('PATCH','camnang_gopy?id=eq.'+encodeURIComponent(id),{xong:true});await supaLoad()}catch(e){alert0('Chưa đánh dấu được, thử lại sau.')}return}try{const ref=DB.doc('gopy/'+uid);const s=await ref.get();if(!s.exists)return;const d=structuredClone(s.data());if(d.items&&d.items[id]){d.items[id].xong=true;await ref.set(d)}}catch(e){alert0('Chưa đánh dấu được, thử lại sau.')}}
function alert0(t){const g=document.getElementById('toast');if(g){g.textContent=t}}
async function initDb(){
 if(SUPA){OWNER=/[?&]quan-ly/.test(location.search);await supaLoad();setInterval(()=>{if(!document.hidden&&!document.querySelector('.fbform'))supaLoad()},30000);return}
 try{USER=await window.claude?.use('user');DB=await window.claude?.use('db')}catch(e){}
 if(USER){try{UID=await USER.id();OWNER=(await USER.isOwner())??false;const c=await USER.can('data.write');if(c===false)CANW=false;if(UID){const p=await USER.profiles([UID]);const nm=p?.[UID]?.name||'';if(nm&&!me.toi){me.toi=nm;st.set('me',me);paintWho()}}}catch(e){}}
 if(!DB||!UID){ALL=localItems();paintFb();return}
 let timer=setTimeout(()=>alert0('Chưa tải được góp ý chung, có thể đang mất mạng.'),10000);
 DB.collection('gopy').onSnapshot(async snap=>{clearTimeout(timer);const out=[];const ids=[];snap.docs.forEach(d=>{const v=d.data()||{};ids.push(d.id);Object.entries(v.items||{}).forEach(([id,it])=>{if(it&&typeof it==='object')out.push({k:String(it.k||''),label:String(it.label||''),goc:String(it.goc||''),sua:String(it.sua||''),lydo:String(it.lydo||''),at:+it.at||0,xong:!!it.xong,id,uid:d.id,ten:String(v.ten||'')})})});out.sort((a,b)=>b.at-a.at);ALL=out;try{const ps=await USER.profiles(ids);ids.forEach(i=>{PROF[i]=ps?.[i]?.name||''})}catch(e){}paintFb()},e=>{clearTimeout(timer);ALL=localItems();paintFb()});
}

<div class="warn"><b>Không được và khi có sự cố</b><ul>${DEMO_NO.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><p>Sau buổi demo: gửi tin <a href="#tin-mau">M4 tóm tắt</a> trong 24 giờ, chuyển khách sang giai đoạn 3 hoặc 4.</p>`},
'gia':()=>{const p=SVC.find(x=>x.k===priceK)||SVC[0];const L=(t,arr)=>`<h3>${t}</h3><ul>${arr.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`;return `<h2>Dịch vụ và giá</h2><p class="mut">Chọn dịch vụ để xem: bán cho ai, nỗi đau, điểm mạnh, giá, demo, thông tin cần gửi và cần chốt. Giá chưa VAT, áp dụng đến hết 12/2026.</p><div class="chips">${SVC.map(x=>`<button class="chip ${x.k===p.k?'on':''}" data-pr="${x.k}">${esc(x.n)}</button>`).join('')}</div>
<div class="card"><h3 style="font-size:19px;color:var(--g2)">${esc(p.n)}</h3><p><b>Khách mục tiêu:</b> ${esc(p.ai)}</p>${L('Nỗi đau của khách',p.pain)}${L('Điểm mạnh nói với khách',p.usp)}${fb('svc:'+p.k+':usp',p.n+' · Khách, nỗi đau, điểm mạnh')}
<h3>Giá</h3><table><tr><th>Hạng mục</th><th style="text-align:right">Giá</th></tr>${p.rows.map(r=>`<tr><td>${md(r[0])}</td><td class="n">${esc(r[1])}</td></tr>`).join('')}</table><ul class="mut">${p.note.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>${fb('svc:'+p.k+':gia',p.n+' · Giá')}
<h3>Demo gì</h3><p><a href="#demo" data-gd="${p.demo}">Kịch bản demo ${esc(DEMO[p.demo].n)}</a></p>${L('Cung cấp, thu thập thông tin gì',p.info)}${L('Cần chốt gì',p.chot)}${fb('svc:'+p.k+':chot',p.n+' · Demo, thông tin, cần chốt')}${p.no?`<div class="warn">${esc(p.no)}</div>`:''}</div>
<h2>Giảm giá</h2><div class="card"><ul>${DISC.map(x=>`<li>${md(x)}</li>`).join('')}</ul>${fb('discount','Quy tắc giảm giá')}</div>
<h2>Tính nhanh</h2><div class="card calc"><div class="grid2"><div><label for="k_l">Loại</label><select id="k_l"><option value="sr2">Sầu riêng chưa mã: gói làm mã trọn năm</option><option value="sr1">Sầu riêng chưa mã: gói làm mã + truy xuất</option><option value="sr3">Sầu riêng đã có mã: truy xuất có nhập liệu</option><option value="sr4">Sầu riêng đã có mã: truy xuất tự nhập</option><option value="ck">Cà phê, cây khác (theo vùng)</option><option value="cs">Cơ sở đóng gói</option></select><label for="k_d">Giảm giá (%)</label><select id="k_d">${[0,3,5,7,10].map(x=>`<option value="${x}">${x}%</option>`).join('')}</select></div><div id="k_in"></div></div><div class="out"><div>Năm đầu<br><span class="big" id="k_y1">—</span></div><div>Năm sau<br><span class="big" id="k_y2">—</span></div></div><p class="mut" id="k_note"></p></div>
<h2>Truy xuất nối với GS1 và Bộ NN&MT thế nào</h2><div class="card"><table class="stack"><tr><th>Chặng</th><th>FarmBase làm gì</th><th>Lưu ý</th></tr>${FLOW.map(f=>`<tr><td><b>${esc(f[0])}</b></td><td>${esc(f[1])}</td><td>${esc(f[2])}</td></tr>`).join('')}</table>${fb('flow','Truy xuất, GS1, Bộ NN&MT')}</div>
<div class="warn"><ul>${LOAI.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`},
'tin-mau':()=>`<h2>Tin nhắn mẫu</h2><p class="mut">Chỗ “…” tự điền trước khi gửi. Bấm Chép rồi dán vào Zalo. Tin của từng giai đoạn cũng hiện trong tab Theo giai đoạn.</p>${khForm()}${MSG.map(m=>msgCard(m[0])).join('')}`,
'tu-choi':()=>`<h2>Khách từ chối</h2><p class="mut">Nghe hết → nhắc lại ý khách → đáp bằng dữ kiện → hỏi lại một câu. Không cãi, không chê đối thủ.</p><input id="o_q" placeholder="Gõ để tìm, ví dụ: đắt, đất, bao lâu"><div id="o_l">${objList('')}</div>`,
'ngung':()=>`<h2>Khi nào ngưng chăm sóc</h2><div class="card"><table class="stack"><tr><th>Tình huống</th><th>Làm gì</th></tr>${STOP.map(s=>`<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td></tr>`).join('')}</table>${fb('stop','Khi nào ngưng chăm sóc')}</div><div class="warn">Mở lại lead khi khách nhắn hỏi, đến sự kiện, được giới thiệu, hoặc có quy định mới ảnh hưởng đến khách.</div>`,
'hoc':()=>`<h2>Học từ cơ bản đến chuyên sâu</h2><div class="card"><table class="stack"><tr><th>Cấp</th><th>Làm được</th><th>Cách học</th></tr>${LEVEL.map(l=>`<tr><td>${esc(l[0])}</td><td>${esc(l[1])}</td><td>${esc(l[2])}</td></tr>`).join('')}</table>${fb('hoc','Lộ trình học')}</div><h2>Báo về hội ý ngay khi</h2><div class="card"><ul>${ASK.map(a=>`<li>${esc(a)}</li>`).join('')}</ul><p class="mut">Cấp 1: buổi gặp đầu và buổi chốt luôn có người đi cùng.</p></div>`,
'gop-y':()=>`<h2>Góp ý của cả đội</h2><p class="mut">${(DB&&UID)||SUPA?'Góp ý được lưu chung, mọi người mở cẩm nang đều thấy.':'Góp ý đang lưu trên máy này. Bấm Chép rồi gửi qua Zalo cho trưởng mảng.'} Trưởng mảng gom lại, Claude cập nhật nội dung chính.</p><p id="toast" class="mut"></p><div id="gopall"></div><p class="mut">${HL}</p>`};
function objList(q){q=q.toLowerCase();return OBJ.filter(o=>!q||o.join(' ').toLowerCase().includes(q)).map((o,i)=>`<details><summary>“${esc(o[0])}”</summary><div class="say">${esc(fill(o[1]))}</div><p><b>Hỏi lại:</b> ${esc(fill(o[2]))}</p>${fb('obj:'+o[0],'Từ chối: '+o[0],o[1])}</details>`).join('')||'<p class="mut">Không thấy. Bấm Góp ý ở đây để thêm câu mới.</p>'+fb('obj:moi','Câu từ chối mới')}

/* ---------- tính giá ---------- */
const VND=n=>(Math.round(n/1e5)/10).toLocaleString('vi-VN')+' tr';
function qrCost(q){if(q<=0)return 0;q=Math.max(10000,Math.ceil(q/5000)*5000);const B=[[50000,80],[100000,72],[200000,64],[500000,56],[Infinity,50]];let c=0,prev=0;for(const [cap,p] of B){if(q>prev){c+=(Math.min(q,cap)-prev)*p;prev=cap}}return c}
function calcIn(){const l=document.getElementById('k_l').value,box=document.getElementById('k_in');const f=(id,lb,v)=>`<label for="${id}">${lb}</label><input id="${id}" type="number" min="0" inputmode="numeric" value="${v}">`;
 box.innerHTML=l.startsWith('sr')?f('k_a','Diện tích (ha)',10):l==='ck'?f('k_a','Số vùng',1)+f('k_b','Số vụ mỗi năm',1):f('k_a','Số sản phẩm',3)+f('k_b','Số tem QR/năm',10000)+`<label for="k_c">Tên miền</label><select id="k_c"><option value="0">Tên miền BVI (miễn phí)</option><option value="1">Tên miền riêng</option></select>`;calcOut()}
function calcOut(){const l=document.getElementById('k_l').value,a=+(document.getElementById('k_a')?.value||0),b=+(document.getElementById('k_b')?.value||0),c=+(document.getElementById('k_c')?.value||0);let y1=0,y2=0,n='';
 if(l==='sr2'){y1=a*4.5e6;y2=a*8e5;n='Năm sau tính theo phí sử dụng tham chiếu 800.000 đ/ha/năm (tự nhập), chốt trong hợp đồng.'}
 if(l==='sr1'){y1=a*3.5e6;y2=a*8e5;n='Năm sau tham chiếu 800.000 đ/ha/năm, chốt trong hợp đồng.'}
 if(l==='sr3'){y1=y2=a*1.5e6}
 if(l==='sr4'){y1=y2=a*8e5}
 if(l==='ck'){const base=5e6+5e6+Math.max(0,a-3)*2e6+a*b*5e6;y1=a?base+5e6:0;y2=a?base:0;n='Thiết lập 5 tr + duy trì 5 tr + tích hợp 5 tr (gồm 3 vùng) + từ vùng thứ 4: 2 tr/vùng + nhập liệu 5 tr/vụ/vùng. Chưa gồm làm mã cây khác (báo giá sau khảo sát).'}
 if(l==='cs'){const base=5e6+5e6+Math.max(0,a-3)*2e6+qrCost(b)+(c?2e6:0);y1=base+5e6;y2=base;n='QR tính lũy tiến, tối thiểu 10.000 mã, làm tròn bội số 5.000. Chưa gồm in tem.'}
 const dc=+(document.getElementById('k_d')?.value||0);y1*=1-dc/100;y2*=1-dc/100;if(dc)n='Đã trừ '+dc+'%. '+n;document.getElementById('k_y1').textContent=VND(y1);document.getElementById('k_y2').textContent=VND(y2);document.getElementById('k_note').textContent=n+' Chưa VAT, chưa gồm công tác xa, tập huấn thêm.'}

/* ---------- khung ---------- */
const main=document.getElementById('main'),nav=document.getElementById('nav'),ovl=document.getElementById('ovl');
function paintWho(){document.getElementById('who').textContent=me.toi?'Đang xem: '+me.toi:'Chưa ghi tên người xem'}
function askName(){const staff=(typeof DG_NAME!=='undefined')?Object.values(DG_NAME).concat(['Giám đốc']):[];ovl.innerHTML=`<div class="ov"><form class="card" id="nmf"><h2>Bạn là ai?</h2><p class="mut">Tên hiện trên góp ý của bạn và tự điền vào tin nhắn mẫu.</p>${staff.length?`<div class="chips">${staff.map(n=>`<button type="button" class="chip" data-pick="${esc(n)}">${esc(n)}</button>`).join('')}</div><label for="nm">Hoặc gõ tên khác</label>`:''}${staff.length?"":`<label for="nm">Tên của bạn</label>`}<input id="nm" required value="${esc(me.toi)}" placeholder="Ví dụ: Ngọc"><div class="row" style="margin-top:10px"><button class="btn g" type="submit">Vào cẩm nang</button></div></form></div>`;setTimeout(()=>document.getElementById('nm')?.focus(),50)}
ovl.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;document.getElementById('nm').value=b.dataset.pick;document.getElementById('nmf').requestSubmit()});
ovl.addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('nm').value.trim();if(!v)return;me.toi=v;st.set('me',me);ovl.innerHTML='';paintWho();render()});
document.getElementById('chg').addEventListener('click',askName);
function render(){const h=(location.hash.slice(1)||'hom-nay');const id=V[h]?h:'hom-nay';nav.innerHTML=TABS.map(t=>`<a href="#${t[0]}" class="${t[0]===id?'on':''}">${t[1]}</a>`).join('');main.innerHTML=V[id]();const a=nav.querySelector('.on');a&&a.scrollIntoView({block:'nearest',inline:'center'});const cd=document.getElementById('c_d');if(cd){cd.valueAsDate=new Date();calc()}if(document.getElementById('k_l'))calcIn();paintFb()}
function calc(){const d=document.getElementById('c_d').valueAsDate,n=+document.getElementById('c_t').value;if(!d)return;d.setDate(d.getDate()+n);document.getElementById('c_out').textContent=d.toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit'})}
main.addEventListener('click',async e=>{const gd=e.target.closest('[data-gd]');if(gd){demoK=gd.dataset.gd;st.set('demo',demoK)}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.c!==undefined){try{await navigator.clipboard.writeText(b.dataset.c);b.textContent='Đã chép'}catch(_){b.textContent='Chọn chữ để chép'}setTimeout(()=>b.textContent='Chép',1500)}
 if(b.dataset.s){segK=b.dataset.s;st.set('seg',segK);render()}
 if(b.dataset.g){stg=+b.dataset.g;st.set('stg',stg);render()}
 if(b.dataset.dm){demoK=b.dataset.dm;st.set('demo',demoK);render()}
 if(b.dataset.pr){priceK=b.dataset.pr;st.set('svc',priceK);render()}
 if(b.dataset.done){const [u,i]=b.dataset.done.split('|');b.disabled=true;await markDone(u,i)}
 if(b.dataset.fb){const k=b.dataset.fb,box=main.querySelector(`[data-fbf="${CSS.escape(k)}"]`);if(box.innerHTML){box.innerHTML='';return}if(!me.toi){askName();return}
  box.innerHTML=`<form class="fbform" data-fk="${esc(k)}"><label>Muốn sửa thành (viết câu mới hoặc ý cần sửa)</label><textarea name="sua" required></textarea><label>Lý do, tình huống gặp phải (không bắt buộc)</label><input name="lydo"><div class="row" style="margin-top:8px"><button class="btn g" type="submit">Gửi góp ý</button><span class="mut">Người góp ý: ${esc(me.toi)}</span></div></form>`;box.querySelector('textarea').focus()}});
main.addEventListener('submit',async e=>{const f=e.target.closest('[data-fk]');if(!f)return;e.preventDefault();const k=f.dataset.fk,sua=f.sua.value.trim();if(!sua)return;const btn=f.querySelector('button');btn.disabled=true;btn.textContent='Đang gửi…';
 const it={k,label:(LBL[k]||[k])[0],goc:String((LBL[k]||['',''])[1]).slice(0,600),sua:sua.slice(0,1500),lydo:f.lydo.value.trim().slice(0,500),at:Date.now(),xong:false,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
 try{const shared=await saveItem(it);f.outerHTML=`<p class="mut">${shared?'Đã gửi. Cả đội thấy góp ý này.':'Đã lưu trên máy này. Vào tab Góp ý để chép gửi trưởng mảng.'}</p>`}catch(err){if(err&&err.code==='invalid_argument'){CANW=false;await saveItem(it);f.outerHTML='<p class="mut">Bạn chưa có quyền ghi góp ý chung, đã lưu trên máy này. Nhờ chủ cẩm nang cấp quyền Contributor.</p>'}else{btn.disabled=false;btn.textContent='Gửi lại'}}});
main.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.d!==undefined){const k='daily_'+new Date().toDateString();let a=st.get(k,[]);const i=+t.dataset.d;a=t.checked?[...a,i]:a.filter(x=>x!==i);st.set(k,a)}
 if(t.id==='c_t'||t.id==='c_d')calc();
 if(t.id==='k_l')calcIn();
 if(['k_a','k_b','k_c','k_d'].includes(t.id))calcOut();
 if(t.id==='f_kh'||t.id==='f_x'){me.khach=document.getElementById('f_kh').value.trim();me.xung=document.getElementById('f_x').value;st.set('me',me);render()}});
main.addEventListener('input',e=>{const t=e.target;if(t.id==='o_q'){document.getElementById('o_l').innerHTML=objList(t.value);paintFb()}if(['k_a','k_b'].includes(t.id))calcOut()});
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
paintWho();render();if(!me.toi)askName();initDb();
}
</script></body></html>
